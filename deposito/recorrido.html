<style>
/* Propio del recorrido: el paso, el lector y la grilla de ranuras */
.paso{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;margin-bottom:8px;
  background:rgba(255,255,255,.03);border:1px solid var(--border)}
.paso.hecho{opacity:.5;border-style:dashed}
.paso.camino{background:rgba(249,115,22,.10);border-color:rgba(249,115,22,.45)}
.paso-n{flex:0 0 26px;height:26px;border-radius:9px;background:rgba(27,200,255,.16);
  color:var(--teal-l);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:700}
.paso.hecho .paso-n{background:rgba(34,197,94,.2);color:#86efac}
.paso-b{flex:1;min-width:0}
.paso-b>span{display:block}   /* son <span> dentro de un boton: sin esto se pegan */
/* Igual que en Solicitar: primero QUÉ es, después dónde y cuánto */
.paso-t{font-size:16px;font-weight:800;line-height:1.25;color:var(--text);overflow-wrap:anywhere}
.paso-d{font-family:var(--display);font-size:13.5px;font-weight:700;color:var(--orange-l);
  line-height:1.3;margin-top:4px}
.paso-m{font-family:var(--mono);font-size:11.5px;color:var(--muted-l);margin-top:3px}
.paso-u{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--teal-l);margin-top:4px}
.paso-u i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted-l);margin-left:5px}

/* Resultado del escaneo: los datos en grande y un botón para seguir.
   La cámara se cierra siempre — leer un QR y que no pase nada visible
   deja al operario sin saber si contó. */
.ok-wrap{text-align:center;padding:6px 0 2px}
.ok-ico{font-size:44px;line-height:1;margin-bottom:6px}
.ok-art{font-size:19px;font-weight:800;line-height:1.25;margin-bottom:5px;overflow-wrap:anywhere}
.ok-u{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--teal-l);letter-spacing:-.5px}
.ok-u i{font-style:normal;font-size:13px;font-weight:500;color:var(--muted-l);margin-left:6px}
.ok-que{font-size:14px;font-weight:600;margin-top:9px;line-height:1.35}
.ok-cod{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px}
.ok-wrap.mal .ok-art{color:#fca5a5}

/* Tarjeta de pedido en la lista: mismo orden que en Solicitar */
.pal-t{font-size:16px!important;font-weight:800!important;line-height:1.25}
.pal-u{display:block;font-family:var(--mono);font-size:16px;font-weight:700;
  color:var(--teal-l);margin-top:6px}
.pal-u i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted-l);margin-left:6px}
.pal-arts{display:block;margin-top:6px}
.pal-li{display:block;font-size:12px;line-height:1.35;color:var(--text)}
.pal-li b{font-family:var(--mono);color:var(--teal-l)}
#qr-box{width:100%;max-width:340px;margin:0 auto;border-radius:14px;overflow:hidden;
  border:1px solid var(--border-s)}
.ranuras{display:grid;gap:5px;margin-top:9px}
.ran{min-height:44px;border-radius:9px;border:1px dashed var(--border-s);background:rgba(0,0,0,.25);
  color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ran:disabled{opacity:.3;cursor:not-allowed}
.ran.on{background:rgba(27,200,255,.2);border:1px solid var(--teal-l);color:var(--teal-l);font-weight:700}
.ran-l{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center}
/* La ranura donde vivía este pallet: un atajo, no una obligación */
.sug{display:block;width:100%;margin-bottom:10px;padding:11px 13px;border-radius:10px;
  font-family:var(--display);font-size:13px;font-weight:700;text-align:left;cursor:pointer;
  color:var(--teal-l);background:rgba(27,200,255,.10);border:1px solid rgba(27,200,255,.42)}
.sug:hover{background:rgba(27,200,255,.18)}
.sug b{font-family:var(--mono);font-size:15px}
.sug.ocupada{color:var(--orange-l);background:rgba(249,115,22,.08);
  border-color:rgba(249,115,22,.35);cursor:default;font-weight:600}
/* Y la celda correspondiente, marcada en la grilla */
.ran.era{border-style:solid;border-color:rgba(27,200,255,.55);color:var(--teal-l)}
</style>
</head>
<body>

<header>
  <img src="../logo.jpg" alt="" class="logo"/>
  <div class="htxt">
    <div class="htit" id="htit">Recorrido</div>
    <div class="hsub" id="hsub">—</div>
  </div>
  <div class="header-right">
    <!-- Quién opera, en cuentas compartidas. Lo pinta SubatirApp.operador -->
    <span id="oper-chip"></span>
    <button class="btn btn-sm" id="btn-volver" onclick="verLista()" style="display:none">← Pedidos</button>
    <a href="solicitar.html" class="btn btn-sm" id="nav-sol" data-nav="solicitar" style="display:none;text-decoration:none">Pedir</a>
    <a href="index.html" class="btn btn-sm" id="nav-panel" data-nav="panel" style="display:none;text-decoration:none">Panel</a>
  </div>
</header>

<main>
  <!-- Lista de pedidos -->
  <section id="v-lista">
    <div class="card">
      <div class="lbl">Pedidos para atender</div>
      <div id="lista" aria-live="polite"></div>
    </div>
  </section>

  <!-- Un recorrido -->
  <section id="v-rec" style="display:none">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="lbl" style="margin:0">Pedido</div>
          <div class="bar-n" id="rec-t">—</div>
        </div>
        <span class="chip" id="rec-e">—</span>
      </div>
      <div class="sol-m" id="rec-m" style="margin-top:7px"></div>
      <button class="btn btn-primary" id="btn-iniciar" onclick="iniciar()"
              style="width:100%;margin-top:11px;display:none">▶ Iniciar recorrido</button>
    </div>

    <div class="card">
      <div class="lbl">Qué hay que levantar · en orden de recorrido</div>
      <div id="pasos"></div>
    </div>
  </section>

  <!-- Lector de QR -->
  <section id="v-scan" style="display:none">
    <div class="card">
      <div class="lbl">Escaneá el QR del pallet</div>
      <div id="qr-box"></div>
      <div class="sol-m" id="scan-st" style="margin-top:11px;text-align:center">Apuntá la cámara al QR…</div>
      <button class="btn" style="width:100%;margin-top:11px" onclick="cerrarScan()">Cancelar</button>
    </div>
  </section>

  <!-- Resultado del escaneo: se lee, se muestra en grande, se acepta -->
  <section id="v-ok" style="display:none">
    <div class="card">
      <div class="ok-wrap" id="ok-wrap">
        <div class="ok-ico" id="ok-ico">✅</div>
        <div class="ok-art" id="ok-art">—</div>
        <div class="ok-u" id="ok-u"></div>
        <div class="ok-que" id="ok-que"></div>
        <div class="ok-cod" id="ok-cod"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="okAceptar()">✓ Aceptar</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="abrirScan()">📷 Escanear otro</button>
    </div>
  </section>

  <!-- Llegó: consumir o guardar -->
  <section id="v-dest" style="display:none">
    <div class="card">
      <div class="lbl">Llegó a destino</div>
      <div class="ok-wrap" style="text-align:left;padding:0">
        <div class="ok-art" id="d-art">—</div>
        <div class="ok-u" id="d-u"></div>
      </div>
      <div class="sol-m" id="d-info" style="margin-top:7px"></div>
      <div class="ok-cod" id="d-cod" style="text-align:left"></div>
      <button class="btn btn-orange" style="width:100%;margin-top:13px" onclick="consumir()">🔥 Consumir (va a fabricación)</button>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="verUbicar()">📍 Guardar en una estantería</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="verRec()">Dejarlo en el piso por ahora</button>
    </div>
  </section>

  <!-- Elegir ranura -->
  <section id="v-ubic" style="display:none">
    <!-- Qué se está guardando. Se vio recién en "Llegó a destino", pero
         elegir ranura lleva su rato y el operario tiene varios pallets
         en el piso: sin esto es fácil guardar el que no era. -->
    <div class="card">
      <div class="lbl">Estás guardando</div>
      <div class="ok-wrap" style="text-align:left;padding:0">
        <div class="ok-art" id="u-art">—</div>
        <div class="ok-u" id="u-u"></div>
      </div>
      <div class="ok-cod" id="u-cod" style="text-align:left"></div>
    </div>

    <div class="card">
      <div class="lbl">Dónde lo guardás</div>
      <select class="inp" id="u-est" onchange="ranuras()" aria-label="Estantería"></select>
      <div id="u-grid"></div>
      <button class="btn" style="width:100%;margin-top:11px" onclick="verDest()">Volver</button>
    </div>
  </section>
</main>

<div class="bar" id="barra" style="display:none">
  <div class="bar-i">
    <div class="bar-n" id="bar-n">—</div>
    <div class="bar-s" id="bar-s"></div>
  </div>
  <button class="btn btn-orange" id="btn-scan" onclick="abrirScan()">📷 Escanear</button>
</div>

<div id="toast-host" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="../supabase-config.js?v=2026-08-27.1530"></script>
<script src="deposito-app.js?v=2026-08-27.1530"></script>
<script>
// Version de la pantalla. La compara deposito-app.js contra version.json;
// si hay una nueva avisa y recarga. bump-version.ps1 escribe las dos juntas.
window.APP_VER='2026-08-27.1530';
</script>
<script>
// ══════════════════════════════════════════════════════════════
//  RECORRIDO — pantalla del operario (celular)
//
//  Atiende un pedido: lo inicia, muestra QUÉ levantar y DÓNDE
//  está, y después es escanear. El escaneo no cambia: usa el
//  mismo imp_pallet_scan de siempre, que ya sabe si el pallet
//  está saliendo o llegando según su estado. Acá no se decide
//  eso, sólo se muestra qué pasó.
//
//  Al llegar, las dos salidas que pidió el usuario: consumir
//  (fabricación) o guardarlo en una estantería.
// ══════════════════════════════════════════════════════════════
var SOLS=[], SOL=null, ITEMS=[], PALS=[], EST=[], SUB=[], ART=[], DEPS=[];
var H5=null, SCAN_BUSY=false, LLEGO=null, U_SLOT=null;

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ n=parseFloat(n)||0; return n.toLocaleString('es-UY'); }
// La CUENTA con la que se entró
function cuentaName(){ var p=SubatirApp.getProfile();
  return p?(p.full_name||(p.email||'').split('@')[0]||'—'):'—'; }
// La PERSONA que opera: es la que queda grabada en el pallet al escanear.
// En cuentas personales las dos devuelven lo mismo.
function whoName(){ return SubatirApp.operador.nombre(); }
function toast(msg,tipo){
  var h=document.getElementById('toast-host'), d=document.createElement('div');
  d.className='toast toast-'+(tipo==='err'?'err':tipo==='ok'?'ok':'info');
  d.textContent=msg; h.appendChild(d);
  setTimeout(function(){ d.classList.add('out');
    setTimeout(function(){ if(d.parentNode) d.remove(); },380); }, tipo==='err'?4600:2800);
}
function vibrar(){ try{ navigator.vibrate && navigator.vibrate(14); }catch(e){} }

// Letra del nivel contada desde abajo: A abajo, D arriba (ver imp_v12).
function letra(fila, filas){ var n=+fila||0; if(filas>0) n=filas-n+1;
  return String.fromCharCode(64+n); }
function estById(id){ return EST.find(function(e){ return String(e.id)===String(id); }); }
function subById(id){ return SUB.find(function(s){ return String(s.id)===String(id); }); }
function artById(id){ return ART.find(function(a){ return String(a.id)===String(id); }); }
function ubicOf(p){
  if(!p.estanteria_id) return 'sin ubicar';
  var e=estById(p.estanteria_id); if(!e) return 'sin ubicar';
  var s=subById(e.subdeposito_id);
  return (s?s.nombre+' · ':'')+e.nombre+' · '+letra(p.fila,e.filas)+p.columna;
}
// Clave de orden del recorrido: primero por sub-depósito, después por
// estantería y por posición. Así se camina el galpón una sola vez en vez
// de ir y volver por cada pallet.
function ordenDe(p){
  var e=estById(p.estanteria_id);
  var s=e?subById(e.subdeposito_id):null;
  return [ (s?s.nombre:'zzz'), (e?e.nombre:'zzz'),
           String(p.columna||0).padStart(3,'0'), String(p.fila||0) ].join('|');
}

// El operador logístico de destino: sólo confirma llegadas. No arma el
// recorrido ni despacha, así que la pantalla le muestra otra cosa —
// lo que viene en camino— en vez de la lista de pedidos por atender.
var SOLO_RECIBE=false, ENCAMINO=[];

SubatirApp.ready.then(function(p){
  if(!p) return;
  SOLO_RECIBE = !SubatirApp.puede('recorrido') && !SubatirApp.puede('importacion')
                && SubatirApp.puede('recepcion_deposito');
  if(SOLO_RECIBE){
    document.getElementById('htit').textContent='Recepción';
    document.querySelector('#v-lista .lbl').textContent='Mercadería en camino';
  }
  document.getElementById('hsub').textContent=cuentaName();
  // Cuenta compartida: quien opera queda en cada escaneo
  SubatirApp.operador.init();
  // Se muestra solo lo que esta persona puede abrir: un link que rebota
  // al login es peor que no tenerlo.
  if(SubatirApp.puede('importacion')) document.getElementById('nav-panel').style.display='';
  if(SubatirApp.puede('solicitante')||SubatirApp.puede('importacion'))
    document.getElementById('nav-sol').style.display='';
  cargar();
  SubatirApp.live(['imp_solicitudes','imp_solicitud_items','imp_pallets'], function(){
    cargar(true);
  }, {delay:900});
});

function cargar(silencioso){
  return Promise.all([
    SB.from('imp_solicitud_resumen').select('*').order('created_at',{ascending:false}).limit(40),
    SB.from('imp_estanterias').select('*').eq('activo',true),
    SB.from('imp_subdepositos').select('*'),
    SB.from('imp_articulos').select('id,descripcion,codigo'),
    SB.from('imp_depositos').select('nombre,tipo').eq('activo',true)
  ]).then(function(r){
    var e=r.find(function(x){ return x.error; });
    if(e){ toast('Error: '+e.error.message,'err'); return; }
    SOLS=r[0].data||[]; EST=r[1].data||[]; SUB=r[2].data||[]; ART=r[3].data||[]; DEPS=r[4].data||[];
    if(SOLO_RECIBE){
      return SB.from('imp_por_recibir').select('*').order('salida_at').then(function(q){
        ENCAMINO=q.data||[]; renderPorRecibir();
      });
    }
    renderLista();
    if(SOL) return abrir(SOL.id, true);
  });
}

// ── Lo que viene en camino (operador logístico) ───────────────
//  Sin pedidos ni recorrido: lo único que importa acá es qué está
//  por llegar y confirmarlo cuando baje del camión.
function renderPorRecibir(){
  var host=document.getElementById('lista');
  document.getElementById('barra').style.display = ENCAMINO.length ? 'flex' : 'none';
  if(!ENCAMINO.length){
    host.innerHTML='<div class="empty">No hay mercadería en camino.<br>'
      +'Cuando despachen un pallet hacia acá, aparece en esta lista.</div>';
    return;
  }
  host.innerHTML=ENCAMINO.map(function(p){
    var h=p.salida_at ? new Date(p.salida_at).toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
    return '<div class="paso camino"><span class="paso-n" aria-hidden="true">🚚</span><span class="paso-b">'
      +'<span class="paso-t">'+esc(p.articulo||('#'+p.articulo_id))+'</span>'
      +'<span class="paso-u">'+fmt(p.unidades)+'<i>unidades</i></span>'
      +'<span class="paso-d">'+esc(p.origen||'—')+' → '+esc(p.destino||'—')+'</span>'
      +'<span class="paso-m">despachó '+esc(p.salida_by||'—')+(h?' · '+h+' h':'')+'</span>'
      +(p.lo_despache_yo
        ? '<span class="paso-m" style="color:#fca5a5">⚠ Lo despachaste vos: lo confirma otra persona</span>'
        : (p.destino_tipo==='FABRICA'
           ? '<span class="paso-m" style="color:var(--orange-l)">Al escanearlo pasa directo a producción</span>'
           : ''))
      +'</span></div>';
  }).join('');
  document.getElementById('bar-n').textContent =
    ENCAMINO.length+' pallet'+(ENCAMINO.length===1?'':'s')+' en camino';
  document.getElementById('bar-s').textContent = 'Escaneá el QR al bajarlo del camión';
}

// ── Lista de pedidos ──────────────────────────────────────────
// El avance en cuatro pasos, igual que en Solicitar: las dos pantallas
// tienen que sentirse la misma app.
var PASOS=[['PENDIENTE','Pedido','1'],['EN_PREPARACION','Preparando','2'],
           ['EN_TRANSITO','En camino','3'],['ENTREGADA','Llegó','4']];
function avanceHTML(estado){
  if(estado==='CANCELADA') return '';
  var i=PASOS.map(function(p){return p[0];}).indexOf(estado);
  if(i<0) i=0;
  return '<span class="prog" role="img" aria-label="Avance: '+esc(PASOS[i][1])+', paso '+(i+1)+' de 4">'
    +PASOS.map(function(p,n){
      var cls = n<i ? 'done' : (n===i ? (n===3?'done fin':'now') : '');
      var ico = n<i ? '✓' : (n===3 && i===3 ? '✓' : p[2]);
      return '<span class="prog-s '+cls+'"><span class="prog-d" aria-hidden="true">'+ico+'</span>'
        +'<span class="prog-l">'+p[1]+'</span></span>';
    }).join('')
  +'</span>';
}

var CHIP={PENDIENTE:['pend','Pendiente'],EN_PREPARACION:['prep','Preparando'],
          EN_TRANSITO:['tran','En camino'],ENTREGADA:['ok','Entregada'],CANCELADA:['can','Cancelada']};
function renderLista(){
  // Lo cerrado no se atiende: primero lo que espera, después lo que va en camino
  var vivas=SOLS.filter(function(s){ return ['PENDIENTE','EN_PREPARACION','EN_TRANSITO'].indexOf(s.estado)>=0; });
  var host=document.getElementById('lista');
  if(!vivas.length){
    host.innerHTML='<div class="empty">No hay pedidos para atender.<br>'
      +'Cuando alguien solicite mercadería, aparece acá.</div>';
    return;
  }
  var ord={PENDIENTE:0,EN_PREPARACION:1,EN_TRANSITO:2};
  vivas.sort(function(a,b){ return (ord[a.estado]-ord[b.estado]) || (a.id-b.id); });
  host.innerHTML=vivas.map(function(s){
    var c=CHIP[s.estado]||['','?'];
    var f=new Date(s.created_at);
    // Misma tarjeta que en Solicitar: primero QUÉ hay que mover, después
    // cuánto, y al final la referencia. Las dos pantallas tienen que
    // sentirse la misma app — y el avance se ve sin abrir el pedido.
    var arts=Array.isArray(s.articulos)?s.articulos:[];
    var titulo = arts.length===1 ? arts[0].art
               : (arts.length ? arts.length+' artículos'
                              : s.items+' pallet'+(s.items===1?'':'s'));
    return '<button type="button" class="pal" onclick="abrir('+s.id+')" style="display:block"'
      +' aria-label="'+esc('Pedido '+s.id+', '+titulo+', '+fmt(s.unidades)+' unidades, '+s.origen+' a '+s.destino+', '+c[1])+'">'
      +'<span class="sol-h"><b class="pal-t">'+esc(titulo)+'</b>'
      +'<span class="chip '+c[0]+'">'+c[1]+'</span></span>'
      +(arts.length>1
        ? '<span class="pal-arts">'+arts.map(function(a){
            return '<span class="pal-li"><b>'+fmt(a.un)+' u.</b> '+esc(a.art)+'</span>';
          }).join('')+'</span>'
        : '')
      +'<span class="pal-u">'+fmt(s.unidades)+'<i>unidades</i></span>'
      +'<span class="pal-m">#'+s.id+' · '+esc(s.origen)+' → '+esc(s.destino)+' · '
      +s.items+' pallet'+(s.items===1?'':'s')+' · pidió '+esc(s.solicitante)
      +' · '+f.toLocaleDateString('es-UY')+'</span>'
      +avanceHTML(s.estado)
    +'</button>';
  }).join('');
}

function verLista(){
  SOL=null;
  ['v-rec','v-scan','v-dest','v-ubic','v-ok'].forEach(function(i){ document.getElementById(i).style.display='none'; });
  document.getElementById('v-lista').style.display='';
  // En modo recepción la barra de escanear no se esconde: es la acción
  // principal, no algo que aparezca al abrir un pedido.
  document.getElementById('barra').style.display = (SOLO_RECIBE && ENCAMINO.length) ? 'flex' : 'none';
  document.getElementById('btn-volver').style.display='none';
  document.getElementById('htit').textContent = SOLO_RECIBE ? 'Recepción' : 'Recorrido';
  cerrarLector();
}
function verRec(){
  // El operador logístico no tiene "un recorrido abierto": su pantalla
  // es la lista de lo que viene en camino.
  if(SOLO_RECIBE){ verLista(); return; }
  ['v-lista','v-scan','v-dest','v-ubic','v-ok'].forEach(function(i){ document.getElementById(i).style.display='none'; });
  document.getElementById('v-rec').style.display='';
  document.getElementById('barra').style.display = SOL && SOL.estado!=='PENDIENTE' ? 'flex' : 'none';
  cerrarLector();
}
function verDest(){
  ['v-lista','v-rec','v-scan','v-ubic','v-ok'].forEach(function(i){ document.getElementById(i).style.display='none'; });
  document.getElementById('v-dest').style.display='';
  document.getElementById('barra').style.display='none';
}
// Pantalla de resultado del escaneo. Siempre cierra la cámara: el operario
// tiene que ver qué contó ese escaneo antes de seguir con el próximo.
//  d = {ok, ico, art, unidades, que, cod}
function verOK(d){
  cerrarLector();
  ['v-lista','v-rec','v-scan','v-dest','v-ubic'].forEach(function(i){ document.getElementById(i).style.display='none'; });
  var w=document.getElementById('ok-wrap');
  w.className='ok-wrap'+(d.ok===false?' mal':'');
  document.getElementById('ok-ico').textContent=d.ico||(d.ok===false?'⚠':'✅');
  document.getElementById('ok-art').textContent=d.art||'—';
  document.getElementById('ok-u').innerHTML=d.unidades!=null?(fmt(d.unidades)+'<i>unidades</i>'):'';
  document.getElementById('ok-que').textContent=d.que||'';
  document.getElementById('ok-cod').textContent=d.cod||'';
  document.getElementById('v-ok').style.display='';
  document.getElementById('barra').style.display='none';
}
function okAceptar(){ verRec(); }

// ── Abrir un pedido ───────────────────────────────────────────
function abrir(id, silencioso){
  return Promise.all([
    SB.from('imp_solicitud_resumen').select('*').eq('id',id).single(),
    SB.from('imp_solicitud_items').select('*').eq('solicitud_id',id)
  ]).then(function(r){
    if(r[0].error){ toast('Error: '+r[0].error.message,'err'); return; }
    SOL=r[0].data; ITEMS=(r[1].data||[]).filter(function(i){ return i.estado!=='CANCELADO'; });
    var ids=ITEMS.map(function(i){ return i.pallet_id; });
    if(!ids.length){ PALS=[]; pintarRec(); if(!silencioso) verRec(); return; }
    // La segunda consulta trae, de lo que está en camino, qué despachó
    // esta misma cuenta. Lo resuelve la base con auth.uid(): comparar
    // nombres acá sería adivinar, y el aviso tiene que ser exacto.
    return Promise.all([
      SB.from('imp_pallets').select('*').in('id',ids),
      SB.from('imp_en_transito_quien').select('id,lo_despache_yo').in('id',ids)
    ]).then(function(q){
      PALS=q[0].data||[];
      var mios={}; (q[1].data||[]).forEach(function(x){ if(x.lo_despache_yo) mios[x.id]=1; });
      PALS.forEach(function(p){ p._loDespacheYo = !!mios[p.id]; });
      // Qué ranuras están ocupadas en las estanterías de este recorrido:
      // sin esto el mini plano se vería vacío alrededor del pallet y no
      // daría la referencia de dónde está parado.
      var ests=[...new Set(PALS.map(function(p){ return p.estanteria_id; }).filter(Boolean))];
      if(!ests.length){ OCUP={}; pintarRec(); if(!silencioso) verRec(); return; }
      return SB.from('imp_pallets').select('estanteria_id,fila,columna')
        .in('estanteria_id',ests).in('estado',['ABIERTO','ESTACIONADO','RECIBIDO'])
        .then(function(o){
          OCUP={}; (o.data||[]).forEach(function(x){
            if(x.fila&&x.columna) OCUP[x.estanteria_id+'-'+x.fila+'-'+x.columna]=1; });
          pintarRec(); if(!silencioso) verRec();
        });
    });
  });
}

// ── Mini plano de la estantería ───────────────────────────────
//  La grilla de frente, y nada más. Antes había además una vista 3D
//  (la misma grilla inclinada en CSS): en el celular, parado en el
//  pasillo, no agregaba nada sobre el plano de frente y sumaba un
//  toque de más para elegir. La ranura buscada parpadea en rojo y es
//  lo único rojo de la pantalla, así no compite con nada.
var OCUP={};                                    // ranuras ocupadas

function planoHTML(p, n){
  var e = p.estanteria_id ? estById(p.estanteria_id) : null;
  if(!e || !p.fila || !p.columna){
    return '<span class="paso-m" style="color:var(--orange-l)">Sin ranura: está suelto en el depósito</span>';
  }
  var cols = e.columnas*2;                      // 2 posiciones por bahía, igual que el panel

  var g='';
  for(var f=1; f<=e.filas; f++){
    g+='<div class="m2d-row" style="grid-template-columns:16px repeat('+cols+',1fr)">'
      +'<span class="m2d-lv">'+letra(f,e.filas)+'</span>';
    for(var c=1; c<=cols; c++){
      var esta=(f===p.fila && c===p.columna);
      g+='<span class="m-cell'+(esta?' target':(OCUP[e.id+'-'+f+'-'+c]?' occ':''))+'"'
        +(esta?' aria-label="Acá está el pallet"':'')+'>'+(esta?'●':'')+'</span>';
    }
    g+='</div>';
  }

  return '<span class="mini-wrap">'
    +'<span class="m2d">'+g+'</span>'
    +'<span class="mini-cap">'+esc(e.nombre)+' · nivel '+letra(p.fila,e.filas)
      +' · posición '+p.columna+'</span>'
  +'</span>';
}

function pintarRec(){
  if(!SOL) return;
  var c=CHIP[SOL.estado]||['','?'];
  document.getElementById('htit').textContent='Pedido #'+SOL.id;
  document.getElementById('btn-volver').style.display='';
  document.getElementById('rec-t').textContent=SOL.origen+' → '+SOL.destino;
  var ch=document.getElementById('rec-e'); ch.className='chip '+c[0]; ch.textContent=c[1];
  document.getElementById('rec-m').textContent=
    SOL.items+' pallet'+(SOL.items===1?'':'s')+' · '+fmt(SOL.unidades)+' u. · pidió '+SOL.solicitante;
  document.getElementById('btn-iniciar').style.display = SOL.estado==='PENDIENTE' ? '' : 'none';

  // Estado por pallet: lo que sigue en su lugar hay que ir a buscarlo
  var byId={}; PALS.forEach(function(p){ byId[p.id]=p; });
  var lista=ITEMS.map(function(i){ return byId[i.pallet_id]; }).filter(Boolean);
  lista.sort(function(a,b){ return ordenDe(a).localeCompare(ordenDe(b)); });

  var n=0, pend=0;
  document.getElementById('pasos').innerHTML = lista.length ? lista.map(function(p){
    var a=artById(p.articulo_id);
    var cls='', nota='';
    if(p.estado==='EN_TRANSITO'){ cls=' camino';
      // Avisar acá y no recién frente al lector: el que despachó no
      // puede confirmar su propia entrega.
      nota = p._loDespacheYo ? '✈ en camino · lo recibe otra persona' : '✈ en camino'; }
    else if(p.estado==='RECIBIDO'||p.estado==='CONSUMIDO'||
            (p.estado==='ESTACIONADO' && p.deposito===SOL.destino)){ cls=' hecho'; nota='✓ entregado'; }
    else { pend++; }
    n++;
    // Sin el código del pallet: al operario no le dice nada para
    // encontrarlo, lo confirma después el QR. Lo que sirve es dónde
    // está, y para eso va el mini plano abajo.
    var falta = cls!==' hecho' && p.estado!=='EN_TRANSITO';
    return '<div class="paso'+cls+'"><span class="paso-n">'+n+'</span><span class="paso-b">'
      +'<span class="paso-t">'+esc(a?a.descripcion:('#'+p.articulo_id))+'</span>'
      +'<span class="paso-u">'+fmt(p.unidades)+'<i>unidades</i></span>'
      +'<span class="paso-d">📍 '+esc(cls===' hecho'?(p.deposito||SOL.destino):ubicOf(p))+'</span>'
      +(nota?('<span class="paso-m">'+nota+'</span>'):'')
      +(falta ? planoHTML(p, n) : '')
      +'</span></div>';
  }).join('') : '<div class="empty">Este pedido no tiene pallets.</div>';

  // Si todo lo que está en camino lo despachó esta cuenta, la llegada no
  // la puede confirmar: mejor decirlo en la barra que dejarlo escanear.
  var enCamino=lista.filter(function(p){ return p.estado==='EN_TRANSITO'; });
  var todoMio = enCamino.length>0 && enCamino.every(function(p){ return p._loDespacheYo; });
  document.getElementById('bar-n').textContent = pend ? (pend+' por levantar') : 'Todo despachado';
  document.getElementById('bar-s').textContent = pend
    ? 'Escaneá cada pallet al cargarlo'
    : (todoMio ? 'Lo despachaste vos: la llegada la confirma otra persona en '+SOL.destino
               : 'Escaneá al llegar a '+SOL.destino);
  document.getElementById('barra').style.display = SOL.estado==='PENDIENTE' ? 'none' : 'flex';
}

function iniciar(){
  var b=document.getElementById('btn-iniciar'); b.disabled=true;
  SB.rpc('imp_solicitud_iniciar',{p_sol:SOL.id, p_user:whoName()}).then(function(r){
    b.disabled=false;
    if(r.error||(r.data&&r.data.ok===false)){
      toast('Error: '+(r.error?r.error.message:r.data.error),'err'); return; }
    toast('▶ Recorrido iniciado — '+r.data.pallets+' pallet(s) con destino '+r.data.destino,'ok');
    abrir(SOL.id);
  });
}

// ── Escaneo ───────────────────────────────────────────────────
//  Un solo botón para las dos puntas: imp_pallet_scan mira el estado
//  del pallet y decide si es salida o llegada. Pedirle al operario que
//  elija cuál es sería pedirle que lleve la cuenta.
function abrirScan(){
  ['v-lista','v-rec','v-dest','v-ubic','v-ok'].forEach(function(i){ document.getElementById(i).style.display='none'; });
  document.getElementById('v-scan').style.display='';
  document.getElementById('barra').style.display='none';
  document.getElementById('scan-st').textContent='Apuntá la cámara al QR…';
  if(typeof Html5Qrcode==='undefined'){
    document.getElementById('scan-st').textContent='No se pudo cargar el lector de QR.'; return; }
  H5=new Html5Qrcode('qr-box');
  H5.start({facingMode:'environment'}, {fps:10, qrbox:{width:230,height:230}}, onQR, function(){})
    .catch(function(e){
      document.getElementById('scan-st').textContent='No se pudo abrir la cámara: '+(e&&e.message||e);
    });
}
function cerrarLector(){
  if(!H5) return;
  try{ H5.stop().then(function(){ try{H5.clear();}catch(_){} H5=null; }); }catch(e){ H5=null; }
}
function cerrarScan(){ cerrarLector(); verRec(); }

// Nombre del artículo de un pallet ya leído por la base
function artDeCodigo(cod){
  var p=(PALS||[]).find(function(x){ return x.codigo===cod; });
  var a=p?artById(p.articulo_id):null;
  return { art:a?a.descripcion:null, unidades:p?p.unidades:null };
}

function onQR(txt){
  if(SCAN_BUSY) return; SCAN_BUSY=true;
  vibrar();
  document.getElementById('scan-st').textContent='Leído: '+txt+' — procesando…';
  SB.rpc('imp_pallet_scan',{p_codigo:txt, p_user:whoName()}).then(function(r){
    setTimeout(function(){ SCAN_BUSY=false; }, 1400);   // evita releer el mismo QR
    if(r.error||(r.data&&r.data.ok===false)){
      var msg=r.error?r.error.message:r.data.error;
      toast(msg,'err');
      verOK({ok:false, ico:'⚠', art:'No se pudo registrar', que:msg, cod:txt});
      return;
    }
    var d=r.data;
    var extra=artDeCodigo(d.pallet);
    if(d.accion==='salida'){
      toast('🚚 Sale hacia '+d.destino,'ok');
      verOK({ico:'🚚', art:d.articulo||extra.art||d.pallet,
             unidades:(d.unidades!=null?d.unidades:extra.unidades),
             que:'Cargado y en camino a '+d.destino, cod:d.pallet});
      cargar(true);
      return;
    }
    // Llegada a una FÁBRICA: no hay nada que decidir. Todo lo que llega
    // se usa, así que la base ya lo dejó consumido y en el depósito no
    // queda saldo.
    if(d.accion==='produccion'){
      toast('🏭 Llegó a '+d.destino+' y pasó a producción','ok');
      verOK({ico:'🏭', art:d.articulo||extra.art||d.pallet,
             unidades:(d.unidades!=null?d.unidades:extra.unidades),
             que:'Llegó a '+d.destino+' y pasó a producción', cod:d.pallet});
      cargar(true);
      return;
    }
    // Llegada a un almacén: hay que decidir qué se hace con él
    cerrarLector();
    LLEGO={codigo:d.pallet, destino:d.destino, tipo:d.destino_tipo};
    SB.from('imp_pallets').select('*').eq('codigo',d.pallet).single().then(function(p){
      LLEGO.pallet=p.data;
      var a=p.data?artById(p.data.articulo_id):null;
      document.getElementById('d-art').textContent=a?a.descripcion:d.pallet;
      document.getElementById('d-u').innerHTML=p.data?(fmt(p.data.unidades)+'<i>unidades</i>'):'';
      document.getElementById('d-info').textContent='Llegó a '+d.destino;
      document.getElementById('d-cod').textContent=d.pallet;
      // Consumir sólo tiene sentido en una fábrica
      document.querySelector('#v-dest .btn-orange').style.display =
        (d.destino_tipo==='FABRICA') ? '' : 'none';
      verDest(); cargar(true);
    });
  }, function(e){ SCAN_BUSY=false; toast('Error: '+(e&&e.message||e),'err'); });
}

// ── Al llegar: consumir o guardar ─────────────────────────────
var CONS=null;
function consumir(){
  if(!LLEGO||!LLEGO.pallet) return;
  if(CONS!==LLEGO.pallet.id){
    CONS=LLEGO.pallet.id;
    toast('Tocá otra vez para confirmar: el consumo no se deshace','info');
    setTimeout(function(){ CONS=null; }, 6000); return;
  }
  CONS=null;
  SB.rpc('imp_pallet_consumir',{p_pallet:LLEGO.pallet.id, p_user:whoName()}).then(function(r){
    if(r.error||(r.data&&r.data.ok===false)){
      toast('Error: '+(r.error?r.error.message:r.data.error),'err'); return; }
    toast('🔥 Consumido — '+fmt(r.data.unidades)+' u.','ok');
    LLEGO=null; cargar(); verRec();
  });
}

function verUbicar(){
  ['v-lista','v-rec','v-scan','v-dest','v-ok'].forEach(function(i){ document.getElementById(i).style.display='none'; });
  document.getElementById('v-ubic').style.display='';

  // El encabezado: primero QUÉ es, después cuánto. Igual que en el resto
  // de las pantallas del recorrido.
  var p=LLEGO&&LLEGO.pallet;
  var a=p?artById(p.articulo_id):null;
  document.getElementById('u-art').textContent = a ? a.descripcion : (LLEGO?LLEGO.codigo:'—');
  document.getElementById('u-u').innerHTML = p ? (fmt(p.unidades)+'<i>unidades</i>') : '';
  document.getElementById('u-cod').textContent = LLEGO ? LLEGO.codigo : '';

  var dep=LLEGO?LLEGO.destino:null;
  var ests=EST.filter(function(e){ return e.deposito===dep; });
  var sel=document.getElementById('u-est');
  sel.innerHTML= ests.length
    ? ests.map(function(e){ var s=subById(e.subdeposito_id);
        return '<option value="'+e.id+'">'+esc((s?s.nombre+' · ':'')+e.nombre)+'</option>'; }).join('')
    : '<option value="">No hay estanterías en '+esc(dep||'')+'</option>';
  U_SLOT=null;
  // Si el pallet ya vivió en una ranura de este depósito, se abre ahí:
  // lo más probable es que vuelva a su lugar de siempre.
  if(p && p.ult_estanteria_id && ests.some(function(e){ return String(e.id)===String(p.ult_estanteria_id); })){
    sel.value=String(p.ult_estanteria_id);
  }
  ranuras();
}

function ranuras(){
  var id=document.getElementById('u-est').value;
  var e=estById(id), host=document.getElementById('u-grid');
  if(!e){ host.innerHTML='<div class="empty">Dibujá estanterías en ⚙ Config Depósito para poder guardar acá.</div>'; return; }
  // 2 posiciones por bahía, igual que el panel
  var cols=e.columnas*2;
  SB.from('imp_pallets').select('id,fila,columna').eq('estanteria_id',e.id)
    .in('estado',['ABIERTO','ESTACIONADO','RECIBIDO']).then(function(r){
      var ocup={}; (r.data||[]).forEach(function(p){ ocup[p.fila+'-'+p.columna]=1; });
      // Dónde vivía este pallet, si era en esta misma estantería
      var p=LLEGO&&LLEGO.pallet, suq=null;
      if(p && String(p.ult_estanteria_id)===String(e.id) && p.ult_fila && p.ult_columna){
        suq={f:p.ult_fila, c:p.ult_columna, libre:!ocup[p.ult_fila+'-'+p.ult_columna]};
      }
      var h='';
      if(suq){
        h += suq.libre
          ? '<button type="button" class="sug" onclick="pickRanura('+suq.f+','+suq.c+')">'
            +'📍 Volver a su lugar: <b>'+letra(suq.f,e.filas)+suq.c+'</b></button>'
          : '<div class="sug ocupada">📍 Estaba en <b>'+letra(suq.f,e.filas)+suq.c+'</b>, '
            +'pero ahora está ocupada. Elegí otra.</div>';
      }
      h+='<div class="ranuras" style="grid-template-columns:18px repeat('+cols+',1fr)">';
      for(var f=1; f<=e.filas; f++){
        h+='<span class="ran-l">'+letra(f,e.filas)+'</span>';
        for(var c=1; c<=cols; c++){
          var libre=!ocup[f+'-'+c], sel=(U_SLOT&&U_SLOT.f===f&&U_SLOT.c===c);
          var era=(suq&&suq.libre&&suq.f===f&&suq.c===c);
          h+='<button type="button" class="ran'+(sel?' on':'')+(era?' era':'')+'" '+(libre?'':'disabled')
            +' onclick="pickRanura('+f+','+c+')" aria-label="'+(libre?'Ranura libre ':'Ocupada ')
            +letra(f,e.filas)+c+(era?'. Acá estaba antes':'')+'">'+(libre?(letra(f,e.filas)+c):'·')+'</button>';
        }
      }
      h+='</div>';
      h+='<button class="btn btn-primary" style="width:100%;margin-top:11px" id="u-ok" '
        +(U_SLOT?'':'disabled')+' onclick="guardar()">Guardar acá</button>';
      host.innerHTML=h;
    });
}
function pickRanura(f,c){ U_SLOT={f:f,c:c}; ranuras(); }

function guardar(){
  if(!LLEGO||!LLEGO.pallet||!U_SLOT) return;
  var est=document.getElementById('u-est').value;
  SB.rpc('imp_pallet_ubicar',{p_pallet:LLEGO.pallet.id, p_est:+est,
                              p_fila:U_SLOT.f, p_col:U_SLOT.c, p_user:whoName()})
    .then(function(r){
      if(r.error||(r.data&&r.data.ok===false)){
        toast('Error: '+(r.error?r.error.message:r.data.error),'err'); return; }
      var e=estById(est);
      toast('📦 Guardado en '+e.nombre+' '+letra(U_SLOT.f,e.filas)+U_SLOT.c,'ok');
      LLEGO=null; U_SLOT=null; cargar(); verRec();
    });
}

// Si se sale de la pantalla, apagar la cámara: queda prendida y come batería
document.addEventListener('visibilitychange', function(){ if(document.hidden) cerrarLector(); });
window.addEventListener('pagehide', cerrarLector);

// Con la camara abierta o un pallet esperando destino, no se recarga.
window.appOcupada=function(){ return !!H5 || !!LLEGO; };

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
