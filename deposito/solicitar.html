<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#07090f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Depósitos"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Solicitar mercadería — Subatir / Prolimpio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="movil.css"/>
<style>
/* El pedido que acaba de llegar: se destaca hasta que lo den por visto */
.sol.llego{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.09);
  box-shadow:0 0 0 1px rgba(34,197,94,.18), 0 8px 26px rgba(0,0,0,.35)}
.sol.llego .sol-h b{color:#86efac}
.llego-av{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#86efac}
.llego-av b{font-family:var(--mono)}
</style>
</head>
<body>

<header>
  <img src="../logo.jpg" alt="" class="logo"/>
  <div class="htxt">
    <div class="htit">Solicitar mercadería</div>
    <div class="hsub" id="hsub">—</div>
  </div>
  <div class="header-right">
    <a href="recorrido.html" class="btn btn-sm" id="nav-rec" style="display:none;text-decoration:none">Recorrido</a>
    <a href="index.html" class="btn btn-sm" id="nav-panel" style="display:none;text-decoration:none">Panel</a>
  </div>
</header>

<main>
  <!-- Lo primero es en qué anda lo que ya pediste: es la pregunta que
       trae a esta pantalla la mayoría de las veces. Pedir algo nuevo
       viene después. -->
  <div class="card hero">
    <div class="lbl">Mis pedidos y su avance</div>
    <div id="mis"></div>
  </div>

  <div class="card">
    <div class="lbl">De dónde a dónde</div>
    <div class="row">
      <select class="inp" id="f-origen" onchange="buscar()" aria-label="Depósito de origen"></select>
      <span style="color:var(--muted)" aria-hidden="true">→</span>
      <select class="inp" id="f-destino" aria-label="Depósito de destino"></select>
    </div>
  </div>

  <div class="card">
    <div class="lbl">Qué necesitás</div>
    <input class="inp" id="q" type="search" placeholder="Buscar por artículo o código…"
           oninput="buscar()" aria-label="Buscar mercadería por artículo o código"/>
    <div class="row" style="margin-top:9px;justify-content:space-between">
      <span id="res-n" style="font-family:var(--mono);font-size:11px;color:var(--muted)">—</span>
      <button class="btn btn-sm" id="btn-todo" onclick="toggleTodo()">Mostrar todo</button>
    </div>
    <div id="res" aria-live="polite"></div>
  </div>
</main>

<div class="bar">
  <div class="bar-i">
    <div class="bar-n" id="bar-n">Nada elegido</div>
    <div class="bar-s" id="bar-s">Tocá los pallets que necesitás</div>
  </div>
  <button class="btn btn-sm" id="btn-limpiar" onclick="limpiar()" style="display:none">Vaciar</button>
  <button class="btn btn-orange" id="btn-ok" onclick="confirmar()" disabled>Pedir</button>
</div>

<div id="toast-host" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=2026-08-06.2300"></script>
<script src="deposito-app.js?v=2026-08-06.2300"></script>
<script>
// Version de la pantalla. La compara deposito-app.js contra version.json;
// si hay una nueva avisa y recarga. bump-version.ps1 escribe las dos juntas.
window.APP_VER='2026-08-06.2300';
</script>
<script>
// ══════════════════════════════════════════════════════════════
//  SOLICITAR MERCADERÍA — pantalla del solicitante (celular)
//
//  Pantalla aparte y no una sección del panel: quien pide no
//  necesita el stock, los pallets ni el mapa 3D, y en un celular
//  esa carga se paga en segundos. Acá sólo hay buscar, marcar y
//  pedir.
//
//  Se eligen PALLETS CONCRETOS (decisión del usuario): son
//  unidades físicas cerradas con su QR. La reserva la garantiza un
//  índice en la base, no esta pantalla — ver imp_v14.sql.
// ══════════════════════════════════════════════════════════════
var DEPS=[], DISP=[], MIS=[], CART={};   // CART: id de pallet → pallet

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ n=parseFloat(n)||0; return n.toLocaleString('es-UY'); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function whoName(){
  var p=SubatirApp.getProfile();
  return p?(p.full_name||(p.email||'').split('@')[0]||'—'):'—';
}
function toast(msg,tipo){
  var h=document.getElementById('toast-host');
  var d=document.createElement('div');
  d.className='toast toast-'+(tipo==='err'?'err':tipo==='ok'?'ok':'info');
  d.textContent=msg; h.appendChild(d);
  setTimeout(function(){ d.classList.add('out');
    setTimeout(function(){ if(d.parentNode) d.remove(); },380); }, tipo==='err'?4600:2800);
}

SubatirApp.ready.then(function(p){
  if(!p) return;
  document.getElementById('hsub').textContent=whoName();
  // El operario y el admin también pueden pedir: a ellos se les deja el
  // acceso al panel, al solicitante puro no (no lo puede abrir).
  if(SubatirApp.puede('importacion')) document.getElementById('nav-panel').style.display='';
  if(SubatirApp.puede('recorrido')||SubatirApp.puede('importacion'))
    document.getElementById('nav-rec').style.display='';
  cargar();
  SubatirApp.live(['imp_solicitudes','imp_solicitud_items','imp_pallets'], cargar, {delay:900});
});

function cargar(){
  return Promise.all([
    SB.from('imp_depositos').select('nombre,tipo').eq('activo',true).order('nombre'),
    SB.from('imp_pallets_disponibles').select('*'),
    SB.from('imp_solicitud_resumen').select('*').order('created_at',{ascending:false}).limit(25)
  ]).then(function(r){
    var err=r.find(function(x){ return x.error; });
    if(err){ toast('Error: '+err.error.message,'err'); return; }
    DEPS=r[0].data||[]; DISP=r[1].data||[]; MIS=r[2].data||[];
    depSelects();
    // Un pallet elegido puede haber dejado de estar disponible mientras
    // se armaba el pedido: se saca del carrito y se avisa, en vez de
    // dejar que falle recién al confirmar.
    var vivos={}; DISP.forEach(function(d){ vivos[d.id]=1; });
    var perdidos=Object.keys(CART).filter(function(id){ return !vivos[id]; });
    if(perdidos.length){
      perdidos.forEach(function(id){ delete CART[id]; });
      toast(perdidos.length+' pallet(s) que habías elegido ya no están disponibles','err');
    }
    buscar(); avisarLlegadas(); renderMis(); renderBar();
  });
}

function depSelects(){
  var o=document.getElementById('f-origen'), d=document.getElementById('f-destino');
  var co=o.value, cd=d.value;
  // Origen: sólo de donde se saca mercadería (un almacén). Destino: el resto.
  var alm=DEPS.filter(function(x){ return x.tipo!=='FABRICA'; });
  o.innerHTML=(alm.length?alm:DEPS).map(function(x){ return '<option>'+esc(x.nombre)+'</option>'; }).join('');
  d.innerHTML=DEPS.map(function(x){ return '<option>'+esc(x.nombre)+'</option>'; }).join('');
  if(co) o.value=co;
  if(cd) d.value=cd;
  else { // por defecto, al primero que no sea el origen
    var otro=DEPS.find(function(x){ return x.nombre!==o.value; });
    if(otro) d.value=otro.nombre;
  }
}

// ── Buscar y listar ───────────────────────────────────────────
//  Qué artículos están desplegados. Se guarda por nombre y no por
//  posición: la lista se rearma en cada búsqueda y las posiciones
//  bailan, el nombre no.
var ABIERTOS={}, TODO=false;
function abrirArt(i){
  var b=document.querySelectorAll('#res .acc-h')[i]; if(!b) return;
  var art=b.getAttribute('data-art');
  ABIERTOS[art]=!b.parentNode.classList.contains('open');
  if(!ABIERTOS[art]) TODO=false;    // si pliega uno a mano, "mostrar todo" deja de mandar
  buscar();
}
function toggleTodo(){
  TODO=!TODO;
  if(!TODO) ABIERTOS={};
  buscar();
}

function buscar(){
  var q=norm(document.getElementById('q').value);
  var org=document.getElementById('f-origen').value;
  var list=DISP.filter(function(p){
    if(p.deposito!==org) return false;
    if(!q) return true;
    return norm(p.articulo).indexOf(q)>=0 || norm(p.art_codigo).indexOf(q)>=0
        || norm(p.codigo).indexOf(q)>=0;
  });
  var host=document.getElementById('res');
  var cnt=document.getElementById('res-n');
  if(!list.length){
    if(cnt) cnt.textContent='0 artículos';
    host.innerHTML='<div class="empty">'+(q
      ? 'Nada disponible con «'+esc(document.getElementById('q').value)+'» en '+esc(org)+'.'
      : 'No hay pallets disponibles en '+esc(org)+'.<br>Un pallet aparece acá cuando está cerrado, '
        +'quieto en su lugar y sin pedir por otro.')+'</div>';
    return;
  }
  // Agrupados por artículo y PLEGADOS: la lista completa de pallets no
  // entra en un celular y obliga a hacer scroll para encontrar algo.
  // Se abre el artículo que interesa y ahí aparecen sus pallets.
  var g={};
  list.forEach(function(p){ (g[p.articulo||'—']=g[p.articulo||'—']||[]).push(p); });
  var arts=Object.keys(g).sort();
  if(cnt) cnt.textContent=arts.length+(arts.length===1?' artículo':' artículos')
      +' · '+list.length+' pallet'+(list.length===1?'':'s');

  var html=arts.map(function(art, i){
    var ps=g[art];
    ps.sort(function(a,b){ return String(a.ubicacion||'').localeCompare(String(b.ubicacion||'')); });
    var elegidos=ps.filter(function(p){ return !!CART[p.id]; }).length;
    // Se abre solo si: lo abrió el usuario, si tiene algo elegido, si
    // está activo "mostrar todo", o si la búsqueda dejó un solo artículo.
    var abierto = ABIERTOS[art] || elegidos>0 || TODO || arts.length===1;
    var cod=ps[0].art_codigo ? String(ps[0].art_codigo) : '';
    var un=ps.reduce(function(a,p){ return a+(parseFloat(p.unidades)||0); },0);

    var cuerpo=ps.map(function(p){
      var on=!!CART[p.id];
      var donde=[p.subdeposito, p.ubicacion].filter(Boolean).join(' · ') || 'sin ubicar';
      return '<button type="button" class="pal'+(on?' on':'')+'" onclick="toggle('+p.id+')"'
        +' aria-pressed="'+on+'"'
        +' aria-label="'+esc(p.codigo+', '+art+', '+fmt(p.unidades)+' unidades, en '+donde
                          +(on?'. Elegido':'. Tocá para elegir'))+'">'
        +'<span class="pal-chk" aria-hidden="true">'+(on?'✓':'')+'</span>'
        +'<span class="pal-b"><span class="pal-t">📍 '+esc(donde)+'</span>'
        +'<span class="pal-m">'+esc(p.codigo)+'</span></span>'
        +'<span class="pal-u">'+fmt(p.unidades)+' u.</span>'
      +'</button>';
    }).join('');

    return '<div class="acc'+(abierto?' open':'')+'">'
      +'<button type="button" class="acc-h" onclick="abrirArt('+i+')" data-art="'+esc(art)+'"'
      +' aria-expanded="'+abierto+'">'
        +'<span class="acc-i" aria-hidden="true">'+(elegidos?'✓':'📦')+'</span>'
        +'<span class="acc-t"><span class="acc-n">'+esc(art)+'</span>'
        +'<span class="acc-m">'+(cod?esc(cod)+' · ':'')+ps.length+' pallet'+(ps.length===1?'':'s')
        +' · '+fmt(un)+' u.</span></span>'
        +(elegidos?'<span class="acc-c">'+elegidos+' elegido'+(elegidos===1?'':'s')+'</span>':'')
        +'<span class="acc-x" aria-hidden="true">▼</span>'
      +'</button>'
      +'<div class="acc-b">'+cuerpo+'</div>'
    +'</div>';
  }).join('');
  host.innerHTML=html;
  var bt=document.getElementById('btn-todo');
  if(bt) bt.textContent = TODO ? 'Plegar todo' : 'Mostrar todo';
}

function toggle(id){
  var p=DISP.find(function(x){ return String(x.id)===String(id); });
  if(!p) return;
  if(CART[id]) delete CART[id]; else CART[id]=p;
  buscar(); renderBar();
}
function limpiar(){ CART={}; buscar(); renderBar(); }

function renderBar(){
  var ids=Object.keys(CART), n=ids.length;
  var u=ids.reduce(function(a,id){ return a+(parseFloat(CART[id].unidades)||0); },0);
  document.getElementById('bar-n').textContent = n
    ? (n+' pallet'+(n===1?'':'s')) : 'Nada elegido';
  document.getElementById('bar-s').textContent = n
    ? (fmt(u)+' unidades') : 'Tocá los pallets que necesitás';
  document.getElementById('btn-ok').disabled = !n;
  document.getElementById('btn-limpiar').style.display = n?'':'none';
}

// ── Confirmar ─────────────────────────────────────────────────
function confirmar(){
  var ids=Object.keys(CART).map(Number);
  if(!ids.length) return;
  var org=document.getElementById('f-origen').value;
  var dst=document.getElementById('f-destino').value;
  if(org===dst){ toast('El origen y el destino son el mismo depósito','err'); return; }
  var b=document.getElementById('btn-ok'); b.disabled=true;
  // El permiso de notificaciones se pide acá y no al abrir la pantalla:
  // recién cuando alguien pide algo tiene sentido avisarle que llegó.
  try{
    if(window.Notification && Notification.permission==='default') Notification.requestPermission();
  }catch(_){}
  SB.rpc('imp_solicitud_crear',{p_origen:org, p_destino:dst, p_pallets:ids,
                                p_nota:null, p_user:whoName()})
    .then(function(r){
      b.disabled=false;
      if(r.error||(r.data&&r.data.ok===false)){
        toast('Error: '+(r.error?r.error.message:r.data.error),'err'); cargar(); return;
      }
      CART={};
      if(r.data.no_disponibles)
        toast('Pedido #'+r.data.solicitud+' creado con '+r.data.items+
              ', pero no estaban: '+r.data.no_disponibles,'err');
      else
        toast('✅ Pedido #'+r.data.solicitud+' enviado — '+r.data.items+' pallet(s)','ok');
      cargar();
    }, function(e){ b.disabled=false; toast('Error: '+(e&&e.message||e),'err'); });
}

// ── Aviso de llegada ──────────────────────────────────────────
//  El solicitante pide y se va a trabajar: si el pedido llega y nadie
//  le dice nada, se entera cuando vuelve a abrir la pantalla. Acá se
//  guarda qué pedidos ya vio, así el aviso salta UNA vez —en el
//  momento en que llega— y el pedido queda destacado hasta que lo dé
//  por visto. Se guarda en el teléfono: es del que mira, no del pedido.
var VISTAS_KEY='dep_sol_vistas';
function vistas(){
  try{ return JSON.parse(localStorage.getItem(VISTAS_KEY)||'[]'); }catch(_){ return []; }
}
function marcarVisto(id){
  var v=vistas(); if(v.indexOf(id)<0) v.push(id);
  try{ localStorage.setItem(VISTAS_KEY, JSON.stringify(v.slice(-60))); }catch(_){}
  renderMis();
}
var ESTADO_PREV={};
function avisarLlegadas(){
  var yo=whoName();
  MIS.forEach(function(s){
    if(s.solicitante!==yo) return;
    var antes=ESTADO_PREV[s.id];
    ESTADO_PREV[s.id]=s.estado;
    // Sólo en el momento del cambio, y sólo si no lo vio ya
    if(antes && antes!=='ENTREGADA' && s.estado==='ENTREGADA' && vistas().indexOf(s.id)<0){
      var txt='📦 Llegó tu pedido #'+s.id+' a '+s.destino;
      toast(txt,'ok');
      try{ if(navigator.vibrate) navigator.vibrate([90,60,90]); }catch(_){}
      // Si la pantalla está en segundo plano y el permiso ya está dado,
      // se avisa por notificación. No se pide permiso de prepo acá:
      // se pide al confirmar un pedido, que es cuando tiene sentido.
      try{
        if(window.Notification && Notification.permission==='granted' && document.hidden){
          new Notification('Mercadería en '+s.destino,
            {body:'Pedido #'+s.id+' · '+s.items+' pallet(s) · '+fmt(s.unidades)+' u.', icon:'icon-192.png'});
        }
      }catch(_){}
    }
  });
}

// ── Mis solicitudes ───────────────────────────────────────────
var CHIP={PENDIENTE:['pend','Pendiente'],EN_PREPARACION:['prep','Preparando'],
          EN_TRANSITO:['tran','En camino'],ENTREGADA:['ok','Entregada'],CANCELADA:['can','Cancelada']};

// El avance en cuatro pasos. Es lo que la gente viene a mirar, así que
// va grande y con el paso actual latiendo: se entiende de un vistazo,
// sin leer.
var PASOS=[['PENDIENTE','Pedido','1'],['EN_PREPARACION','Preparando','2'],
           ['EN_TRANSITO','En camino','3'],['ENTREGADA','Llegó','4']];
function avanceHTML(estado){
  if(estado==='CANCELADA') return '';
  var i=PASOS.map(function(p){return p[0];}).indexOf(estado);
  if(i<0) i=0;
  return '<div class="prog" role="img" aria-label="Avance: '+esc(PASOS[i][1])+', paso '+(i+1)+' de 4">'
    +PASOS.map(function(p,n){
      var cls = n<i ? 'done' : (n===i ? (n===3?'done fin':'now') : '');
      var ico = n<i ? '✓' : (n===3 && i===3 ? '✓' : p[2]);
      return '<div class="prog-s '+cls+'"><span class="prog-d" aria-hidden="true">'+ico+'</span>'
        +'<span class="prog-l">'+p[1]+'</span></div>';
    }).join('')
  +'</div>';
}
function renderMis(){
  var yo=whoName();
  var mias=MIS.filter(function(s){ return s.solicitante===yo; });
  var host=document.getElementById('mis');
  if(!mias.length){
    host.innerHTML='<div class="empty">Todavía no pediste nada.</div>'; return;
  }
  host.innerHTML=mias.map(function(s){
    var c=CHIP[s.estado]||['','?'];
    var f=new Date(s.created_at);
    var puedeCancelar = s.estado==='PENDIENTE' || s.estado==='EN_PREPARACION';
    var llego = s.estado==='ENTREGADA' && vistas().indexOf(s.id)<0;
    return '<div class="sol'+(llego?' llego':'')+'">'
      +'<div class="sol-h"><b>#'+s.id+' · '+esc(s.origen)+' → '+esc(s.destino)+'</b>'
      +'<span class="chip '+c[0]+'">'+c[1]+'</span></div>'
      +'<div class="sol-m">'+s.items+' pallet'+(s.items===1?'':'s')+' · '+fmt(s.unidades)+' u. · '
      +f.toLocaleDateString('es-UY')+' '+f.toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'})
      +(s.entregados?(' · '+s.entregados+' entregado'+(s.entregados===1?'':'s')):'')+'</div>'
      +avanceHTML(s.estado)
      +(llego?('<div class="llego-av">✅ Llegó a '+esc(s.destino)
              +(s.entregada_at?(' · <b>'+new Date(s.entregada_at).toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'})+'</b>'):'')
              +'</div><button class="btn btn-sm" style="margin-top:9px" onclick="marcarVisto('+s.id+')">Enterado</button>'):'')
      +(puedeCancelar?('<button class="btn btn-sm" style="margin-top:9px" onclick="cancelar('+s.id+')">Cancelar pedido</button>'):'')
    +'</div>';
  }).join('');
}
// Cancelar libera los pallets. Se pide confirmación en dos toques sobre
// el mismo botón: un confirm() nativo bloquea el navegador.
var CANC=null;
function cancelar(id){
  if(CANC!==id){
    CANC=id; toast('Tocá otra vez para cancelar el pedido #'+id,'info');
    setTimeout(function(){ if(CANC===id) CANC=null; }, 6000);
    return;
  }
  CANC=null;
  SB.rpc('imp_solicitud_cancelar',{p_sol:id, p_user:whoName()}).then(function(r){
    if(r.error||(r.data&&r.data.ok===false)){
      toast('Error: '+(r.error?r.error.message:r.data.error),'err'); return;
    }
    toast('Pedido #'+id+' cancelado','ok'); cargar();
  });
}

// ── PWA ───────────────────────────────────────────────────────
// Con pallets ya elegidos no se recarga: se perderia el pedido a medio armar.
window.appOcupada=function(){ return Object.keys(CART).length>0; };

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
