<!DOCTYPE html>

<head>

<!-- El módulo Importación pasó a ser una app aparte: Control de Stock Depósitos.

<meta http-equiv="refresh" content="2; url=deposito/index.html"/>
<title>Se mudó · Control de Stock Depósitos</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:#07090f;color:#e2e8f0;font-family:'DM Sans',system-ui,sans-serif;text-align:center}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 8% 8%,rgba(14,138,170,.15) 0%,transparent 55%),
             radial-gradient(ellipse 60% 50% at 92% 92%,rgba(249,115,22,.12) 0%,transparent 55%)}
.box{position:relative;z-index:1;max-width:420px;padding:38px 32px;border-radius:20px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.ico{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(135deg,#0e8aaa,#f97316);box-shadow:0 8px 24px rgba(249,115,22,.3)}
h1{font-family:'Manrope',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
p{font-size:13px;color:#8ea0b8;line-height:1.6}
a.go{display:inline-block;margin-top:22px;padding:12px 22px;border-radius:10px;text-decoration:none;
  font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(135deg,#0e8aaa,#f97316);transition:filter .15s,transform .15s}
a.go:hover{filter:brightness(1.08);transform:translateY(-1px)}
.small{margin-top:14px;font-size:11px;color:#5a6a80}
</style>
</head>
<body>
<div class="box">
  <div class="ico">🏬</div>
  <h1>Este módulo se mudó</h1>
  <p><b>Importación</b> ahora es una app aparte: <b>Control de Stock Depósitos</b>.
     Te estamos llevando ahí.</p>
  <a class="go" href="deposito/index.html">Ir ahora →</a>
  <div class="small">Actualizá tus favoritos: <b>deposito/index.html</b></div>
</div>
<script>
// Redirección inmediata; el meta refresh queda de respaldo si no hay JS.
// replace() para que "atrás" no vuelva a rebotar acá.
location.replace('deposito/index.html');
</script>
</body>
</html>
